services:
  - type: web
    name: docuchat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FREE_QUESTIONS_PER_DAY
        value: "20"
      - key: FREE_DOCS_PER_WORKSPACE
        value: "3"
