name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (Render free sleeps after 15 min idle)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://docuchat-7jap.onrender.com/api/health) && [ "$code" = "200" ] && echo "OK $code" && exit 0
            echo "attempt $i got $code"; sleep 10
          done
          exit 1
