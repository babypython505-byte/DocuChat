name: Keep DocuChat awake
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (Render free sleeps after 15 idle minutes)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${APP_URL}/api/health"
        env:
          APP_URL: https://docuchat-7jap.onrender.com
